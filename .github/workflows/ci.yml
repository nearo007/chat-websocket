name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.0
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres@localhost:5432/app_test
      JWT_SECRET: test-access-secret-with-at-least-32-characters
      JWT_SECRET_REFRESH: test-refresh-secret-with-at-least-32-characters
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      RUN_DB_TESTS: "true"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run db:deploy
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run docs:lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
